{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<form method="post" class="card narrow" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h1>Đăng nhập</h1>
  <label>Tên đăng nhập <input name="username" value="{{ username }}" autofocus required autocomplete="username"></label>
  <label>Mật khẩu <input name="password" type="password" required autocomplete="current-password"></label>
  <label class="inline"><input type="checkbox" name="remember"> Ghi nhớ đăng nhập 7 ngày</label>
  <button type="submit">Đăng nhập</button>
  {% if config.REGISTRATION_ENABLED %}
  <p class="muted">Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Đăng ký</a></p>
  {% endif %}
</form>
{% endblock %}
