{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<form method="post" class="card narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h1>Đổi mật khẩu</h1>
  {% if current_user.must_change_password %}
  <p class="muted">Bạn đang dùng mật khẩu tạm. Vui lòng đặt mật khẩu mới để tiếp tục.</p>
  {% endif %}
  <label>Mật khẩu hiện tại <input name="current_password" type="password" required autocomplete="current-password"></label>
  <label>Mật khẩu mới <input name="new_password" type="password" required minlength="8" autocomplete="new-password">
    <small>Tối thiểu 8 ký tự, gồm cả chữ và số.</small></label>
  <label>Nhập lại mật khẩu mới <input name="confirm_password" type="password" required autocomplete="new-password"></label>
  <button type="submit">Đổi mật khẩu</button>
</form>
{% endblock %}
